<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HeatmapAPI Example</title>
  <style>
    #map {
      width: 600px;
      height: 400px;
    }
  </style>
</head>
<body>

<!-- Replace YOUR_GOOGLE_MAPS_API_KEY with your own key -->
<script 
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap&v=weekly" 
  async defer>
</script>

<div id="map"></div>

<script>
  // example version 1.1
  let map;
  let heatmapOverlay;
  let dataPoints;
  let isInitialLoad = true;

  function initMap() {
    const center = { lat: 37.775, lng: -122.434 };

    map = new google.maps.Map(document.getElementById("map"), {
      zoom: 12,
      center: center,
      mapTypeId: "satellite",
    });

    // Generate random demo points
    dataPoints = generateRandomPoints(center, 50);

    // Render once and then on every map movement
    google.maps.event.addListener(map, 'idle', () => {
      if (isInitialLoad) {
        isInitialLoad = false;
      }
      updateHeatmap();
    });
  }

  function updateHeatmap() {
    const bounds = map.getBounds();
    if (!bounds || !Array.isArray(dataPoints) || dataPoints.length === 0) return;

    const ne = bounds.getNorthEast();
    const sw = bounds.getSouthWest();

    const dataPointsString = dataPoints.map(p => `${p.Lat},${p.Lon},${p.Weight}`).join(",");

    const heatmapParameters = {
      Width: 600,
      Height: 400,
      Lat1: sw.lat(),
      Lat2: ne.lat(),
      Lon1: sw.lng(),
      Lon2: ne.lng(),
      DistanceMultiple: 20,
      UseAverage: false,
      ColorPalette: '1',
      DataPoints: dataPointsString
    };

    callHeatmapService(heatmapParameters);
  }

  function callHeatmapService(heatmapParameters) {
    fetch('https://heatmapapi-591111065781.us-west3.run.app/api/createHeatmap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(heatmapParameters)
    })
    .then(response => {
      if (!response.ok) throw new Error(`HTTP error ${response.status}`);
      return response.blob();
    })
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const bounds = new google.maps.LatLngBounds(
        new google.maps.LatLng(heatmapParameters.Lat1, heatmapParameters.Lon1),
        new google.maps.LatLng(heatmapParameters.Lat2, heatmapParameters.Lon2)
      );
      if (heatmapOverlay) heatmapOverlay.setMap(null);
      heatmapOverlay = new google.maps.GroundOverlay(url, bounds);
      heatmapOverlay.setMap(map);
    })
    .catch(err => console.error('Error updating heatmap:', err));
  }

  function generateRandomPoints(center, numPoints) {
    const points = [];
    for (let i = 0; i < numPoints; i++) {
      const lat = center.lat + (Math.random() - 0.5) / 25;
      const lon = center.lng + (Math.random() - 0.5) / 12;
      points.push({ Lat: lat, Lon: lon, Weight: 1 });
    }
    return points;
  }
</script>

</body>
</html>
